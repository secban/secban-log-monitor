# Matcher for access log bad requests.
http-bad-request:
  match_regexes:
    - '" (?:400|401|403|444) ' # Bad request, Unauthorized, Forbidden, No Response
  rule: "default" # Ban name. See the secban agent configuration at /etc/secban/rules.d/.
  watcher: "http-combined" # Watcher for HTTP combined access logs, see /etc/secban/watchers.d/http-combined.yaml
