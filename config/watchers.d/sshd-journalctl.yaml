sshd-journalctl:
  args:
    - "-afb"
    - "-p"
    - "info"
    - "-n0"
    - "-o"
    - "cat"
    - "SYSLOG_FACILITY=4"
    - "SYSLOG_FACILITY=10"
  command: "journalctl"
  env:
    - "LANG=C"
  ip_regex: '(?i:from|with|by|user\s+\S+)\s+(?P<ip>(?:[0-9a-fA-F]{1,4}:[0-9a-fA-F:]*[0-9a-fA-F]|::[0-9a-fA-F:]*|\d{1,3}(?:\.\d{1,3}){3}))(?:%\S+)?(?::\s|\s|$)'
  test_args:
    - "-b"
    - "-p"
    - "info"
    - "-n500"
    - "-o"
    - "cat"
    - "SYSLOG_FACILITY=4"
    - "SYSLOG_FACILITY=10"
